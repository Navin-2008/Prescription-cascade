[project]
name = "prescription-cascade-detector-backend"
version = "0.1.0"
description = "Minimal backend for prescription cascade detection hackathon."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "requests",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "api"]
